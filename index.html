<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chronograph</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <header id="header">
            <span class="logo">◈ chronograph</span>
            <span class="time-display">time <span id="current-time-label">—</span></span>
        </header>

        <section id="timeline-section">
            <div id="timeline" role="slider" tabindex="0" aria-label="Timeline scrubber" aria-valuemin="0"
                aria-valuemax="100" aria-valuenow="0">
                <div id="timeline-track">
                    <div id="timeline-ticks"></div>
                    <div id="timeline-indicator"></div>
                </div>
                <div id="timeline-labels"></div>
            </div>
            <div id="time-nav">
                <button id="btn-prev" title="Step to previous event">◀</button>
                <input type="number" id="time-input" min="0" step="1" value="0">
                <button id="btn-next" title="Step to next event">▶</button>
            </div>
        </section>

        <main id="main">
            <div id="graph-panel">
                <div id="graph-header" class="panel-header">
                    <span class="panel-title">graph at <span id="graph-time-label">—</span></span>
                    <span id="node-count" class="panel-meta"></span>
                </div>
                <div id="graph-view">
                    <svg id="graph-svg" width="100%" height="100%"></svg>
                    <div id="graph-loading" class="loading-overlay hidden">loading…</div>
                    <div id="graph-empty" class="empty-state hidden">
                        <p>No edges at this time.</p>
                        <p class="empty-hint">Post an event or scrub forward.</p>
                    </div>
                </div>
            </div>

            <aside id="inspector">
                <div id="inspector-why" class="card">
                    <div class="card-header">
                        <span class="card-title">why</span>
                        <label class="card-field">
                            <span class="field-label">node</span>
                            <input type="text" id="why-node" value="checkout" list="node-list">
                            <datalist id="node-list"></datalist>
                        </label>
                        <button id="btn-why" class="btn-query">trace</button>
                    </div>
                    <div id="why-result" class="card-body">
                        <div class="empty-state small">
                            <p>Click <strong>trace</strong> to find root cause.</p>
                        </div>
                    </div>
                </div>

                <div id="inspector-impact" class="card">
                    <div class="card-header">
                        <span class="card-title">impact</span>
                    </div>
                    <div id="impact-result" class="card-body">
                        <div class="empty-state small">
                            <p>Click a node in the graph.</p>
                        </div>
                    </div>
                </div>

                <div id="inspector-diff" class="card">
                    <div class="card-header">
                        <span class="card-title">diff</span>
                        <label class="card-field">
                            <span class="field-label">t1</span>
                            <input type="number" id="diff-t1" min="0" step="1" value="0">
                        </label>
                        <label class="card-field">
                            <span class="field-label">t2</span>
                            <input type="number" id="diff-t2" min="0" step="1" value="0">
                        </label>
                        <button id="btn-diff" class="btn-query">diff</button>
                    </div>
                    <div id="diff-result" class="card-body">
                        <div class="empty-state small">
                            <p>Set t1/t2 and click <strong>diff</strong>.</p>
                        </div>
                    </div>
                </div>
            </aside>
        </main>

        <section id="events-section">
            <div class="section-header">
                <span class="section-title">event feed</span>
                <span id="event-count" class="panel-meta"></span>
            </div>
            <div id="event-list">
                <div class="empty-state small">
                    <p>No events yet.</p>
                </div>
            </div>
        </section>
    </div>

    <div id="toast" class="hidden"></div>

    <script src="app.js"></script>
</body>

</html>
